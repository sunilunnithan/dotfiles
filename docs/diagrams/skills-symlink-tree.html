<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portable agent skills · Tree</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1000px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · sunilu/dotfiles</p>
    <h1>How one skills folder reaches every coding agent</h1>

    <svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="skl-title skl-desc">
      <title id="skl-title">Portable agent skills tree</title>
      <desc id="skl-desc">Tree diagram showing agents/.agents/skills in the dotfiles repo as the git-tracked source, symlinked to ~/.agents/skills, which Claude Code's ~/.claude/skills symlinks to; a not-yet-created ~/.codex/skills symlink is shown as a planned sibling.</desc>
      <defs>
        <pattern id="skl-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#skl-dots)" opacity="0.55"/>

      <!-- Tier tags (left margin) -->
      <text x="40" y="108" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · SOURCE</text>
      <text x="40" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 1 · SHARED LINK</text>
      <text x="40" y="364" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 2 · PER-AGENT</text>

      <!-- Connectors drawn first (behind nodes) -->
      <!-- Root -> Tier 1 -->
      <path d="M 500 128 L 500 208" fill="none" stroke="#4f5d75" stroke-width="1"/>

      <!-- Tier 1 -> Tier 2 bus -->
      <path d="M 500 256 L 500 296 L 300 296 L 300 336" fill="none" stroke="#4f5d75" stroke-width="1"/>
      <path d="M 500 296 L 700 296 L 700 336" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>

      <!-- Root node: dotfiles source (coral focal) -->
      <rect x="420" y="80" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="80" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="428" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="444" y="97" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
      <text x="500" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">agents/.agents/skills</text>
      <text x="500" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dotfiles repo · git-tracked</text>

      <!-- Tier 1: ~/.agents/skills -->
      <rect x="420" y="208" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="428" y="216" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="445" y="225" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINK</text>
      <text x="500" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">~/.agents/skills</text>
      <text x="500" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">symlink · shared target</text>

      <!-- Tier 2: ~/.claude/skills (active) -->
      <rect x="220" y="336" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="220" y="336" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="228" y="344" width="34" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="245" y="353" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LINK</text>
      <text x="300" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">~/.claude/skills</text>
      <text x="300" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">symlink · Claude Code</text>

      <!-- Tier 2: ~/.codex/skills (planned, optional treatment) -->
      <rect x="620" y="336" width="160" height="48" rx="6" fill="#f5f5f5"/>
      <rect x="620" y="336" width="160" height="48" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="700" y="360" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">~/.codex/skills</text>
      <text x="700" y="372" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">symlink · not yet created</text>

      <!-- Legend strip -->
      <line x1="40" y1="396" x2="860" y2="396" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="412" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="140" y="404" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="160" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Source of truth</text>

      <rect x="300" y="404" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="320" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Active symlink</text>

      <rect x="440" y="404" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="460" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Planned, not yet created</text>

      <text x="600" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">One real folder, edited once, read by every agent.</text>
    </svg>
  </div>
</body>
</html>
